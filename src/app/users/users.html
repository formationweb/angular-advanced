<div>
    <input type="text" [(ngModel)]="searchValue">
    <select [(ngModel)]="extension">
        @for (_ext of extensions() ; track _ext) {
            <option>{{ _ext }}</option>
        }
    </select>
    @for (user of usersFiltered() ; track user.id) {
        <div test-users>
           <app-user-card [user]="user" />
        </div>
    }
    <!-- @for (user of users$ | async; track user.id) {
        <div test-users>
           <app-user-card [user]="user" />
        </div>
    } -->
</div>
