<form (submit)="login($event)" novalidate>
    <label>Email</label>
    <input type="text" [formField]="loginForm.email"> 

    <label>Mot de passe</label>
    <input type="password" [formField]="loginForm.password"> 

    @if (isInvalid()) {
        <span>C'est invalide</span>
        {{ errorEmail() }}
    }

    <button>Connexion</button>
</form>
